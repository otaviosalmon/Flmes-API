<svg width="680" height="540" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- UI Layer -->
  <rect x="40" y="40" width="600" height="150" rx="14" fill="#1A1A2E" stroke="#E94560" stroke-width="1.5"/>
  <text x="340" y="68" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">Camada de Apresentação (UI)</text>
  <text x="340" y="85" text-anchor="middle" font-size="12" fill="#B0B0C0">screens/ · widgets/</text>

  <rect x="60"  y="100" width="160" height="68" rx="8" fill="#0F3460" stroke="#E94560" stroke-width="0.8"/>
  <text x="140" y="128" text-anchor="middle" font-size="13" font-weight="600" fill="#F5F5F5">HomeScreen</text>
  <text x="140" y="148" text-anchor="middle" font-size="11" fill="#B0B0C0">Lista + Busca</text>

  <rect x="260" y="100" width="160" height="68" rx="8" fill="#0F3460" stroke="#E94560" stroke-width="0.8"/>
  <text x="340" y="128" text-anchor="middle" font-size="13" font-weight="600" fill="#F5F5F5">DetailScreen</text>
  <text x="340" y="148" text-anchor="middle" font-size="11" fill="#B0B0C0">Info + Favoritar</text>

  <rect x="460" y="100" width="160" height="68" rx="8" fill="#0F3460" stroke="#E94560" stroke-width="0.8"/>
  <text x="540" y="128" text-anchor="middle" font-size="13" font-weight="600" fill="#F5F5F5">FavoritesScreen</text>
  <text x="540" y="148" text-anchor="middle" font-size="11" fill="#B0B0C0">Stream Firestore</text>

  <!-- Arrows UI → Services -->
  <line x1="140" y1="190" x2="140" y2="228" stroke="#E94560" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="340" y1="190" x2="340" y2="228" stroke="#E94560" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="540" y1="190" x2="540" y2="228" stroke="#E94560" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Services Layer -->
  <rect x="40" y="230" width="600" height="120" rx="14" fill="#16213E" stroke="#4FC3F7" stroke-width="1.2"/>
  <text x="340" y="258" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">Camada de Serviços</text>
  <text x="340" y="274" text-anchor="middle" font-size="12" fill="#B0B0C0">services/ — isola acesso externo</text>

  <rect x="66" y="285" width="240" height="44" rx="8" fill="#1A1A2E" stroke="#4FC3F7" stroke-width="0.8"/>
  <text x="186" y="303" text-anchor="middle" font-size="13" font-weight="600" fill="#F5F5F5">TmdbService</text>
  <text x="186" y="321" text-anchor="middle" font-size="11" fill="#B0B0C0">http · singleton · debounce</text>

  <rect x="374" y="285" width="240" height="44" rx="8" fill="#1A1A2E" stroke="#4FC3F7" stroke-width="0.8"/>
  <text x="494" y="303" text-anchor="middle" font-size="13" font-weight="600" fill="#F5F5F5">FavoritesService</text>
  <text x="494" y="321" text-anchor="middle" font-size="11" fill="#B0B0C0">Firestore · stream reativo</text>

  <!-- Arrows Services → Model -->
  <line x1="186" y1="350" x2="186" y2="388" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Model Layer -->
  <rect x="40" y="390" width="600" height="64" rx="14" fill="#FFD700" fill-opacity="0.12" stroke="#FFD700" stroke-width="1"/>
  <text x="340" y="418" text-anchor="middle" font-size="14" font-weight="600" fill="#FFD700">Model — movie.dart</text>
  <text x="340" y="438" text-anchor="middle" font-size="11" fill="#B0B0C0">fromJson() · toMap() · fromFirestore() · posterUrl · backdropUrl</text>

