  <line x1="494" y1="355" x2="520" y2="480" stroke="#4FC3F7" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <rect x="40"  y="480" width="270" height="44" rx="10" fill="#E94560" fill-opacity="0.15" stroke="#E94560" stroke-width="1"/>
