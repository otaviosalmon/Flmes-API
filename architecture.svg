  <text x="175" y="516" text-anchor="middle" font-size="11" fill="#B0B0C0">REST · themoviedb.org · pt-BR</text>

  <rect x="370" y="480" width="270" height="44" rx="10" fill="#4FC3F7" fill-opacity="0.15" stroke="#4FC3F7" stroke-width="1"/>
  <text x="505" y="498" text-anchor="middle" font-size="13" font-weight="600" fill="#4FC3F7">Firebase Firestore</text>
  <text x="505" y="516" text-anchor="middle" font-size="11" fill="#B0B0C0">NoSQL · coleção favorites</text>
</svg>
